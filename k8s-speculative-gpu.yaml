# Kubernetes Deployment for DeepSeek-R1 Speculative Inference
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-speculative-gateway
  namespace: ai-inference
  labels:
    app: deepseek-speculative-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deepseek-speculative-gateway
  template:
    metadata:
      labels:
        app: deepseek-speculative-gateway
    spec:
      containers:
        - name: vllm-speculative-server
          image: vllm/vllm-openai:latest
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model=deepseek-ai/DeepSeek-R1"
            - "--tensor-parallel-size=8"
            - "--speculative-model=Qwen/Qwen2.5-Coder-1.5B-Instruct"
            - "--num-speculative-tokens=4"
            - "--gpu-memory-utilization=0.92"
            - "--max-model-len=8192"
            - "--port=8000"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "8"
              memory: 384Gi
              cpu: "64"
            requests:
              nvidia.com/gpu: "8"
              memory: 256Gi
              cpu: "32"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
